name: Inspect bundled source
on:
  push:
    paths:
      - ".github/workflows/inspect-source.yml"
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source archive for inspection
        run: |
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile("source.zip") as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Corrupt member: {bad}")
              z.extractall("source_inspection")
              print("Extracted:")
              for name in z.namelist():
                  print(name)
          PY
      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source_inspection
          git commit -m "Temporarily expose bundled source for HH integration review" || exit 0
          git push
